services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poolsatis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poolsatis}
      POSTGRES_DB: ${POSTGRES_DB:-poolsatis}
    volumes:
      - poolstatis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poolsatis} -d ${POSTGRES_DB:-poolsatis}"]
      interval: 5s
      timeout: 5s
      retries: 20

  poolstatis:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-poolsatis}:${POSTGRES_PASSWORD:-poolsatis}@postgres:5432/${POSTGRES_DB:-poolsatis}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      HOST: 0.0.0.0
      PORT: 3300
      POOLSTATIS_PUBLIC_URL: ${POOLSTATIS_PUBLIC_URL:-http://localhost:8080}
      OUTBOUND_ALLOW_LOCAL_HTTP: ${OUTBOUND_ALLOW_LOCAL_HTTP:-false}
      POOLSTATIS_CURSOR_SIGNING_SECRET: ${POOLSTATIS_CURSOR_SIGNING_SECRET:?POOLSTATIS_CURSOR_SIGNING_SECRET is required}
      INGEST_BUFFER_MAX_EVENTS: ${INGEST_BUFFER_MAX_EVENTS:-1000}
      INGEST_BUFFER_MAX_DELAY_MS: ${INGEST_BUFFER_MAX_DELAY_MS:-10}
      INGEST_BUFFER_MAX_PENDING_EVENTS: ${INGEST_BUFFER_MAX_PENDING_EVENTS:-50000}
      QUERY_CACHE_TTL_MS: ${QUERY_CACHE_TTL_MS:-1000}
      QUERY_CACHE_MAX_ENTRIES: ${QUERY_CACHE_MAX_ENTRIES:-1000}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_INGEST_KEY_PER_SECOND: ${RATE_LIMIT_INGEST_KEY_PER_SECOND:-50000}
      RATE_LIMIT_INGEST_KEY_BURST: ${RATE_LIMIT_INGEST_KEY_BURST:-100000}
      RATE_LIMIT_INGEST_PROJECT_PER_SECOND: ${RATE_LIMIT_INGEST_PROJECT_PER_SECOND:-200000}
      RATE_LIMIT_INGEST_PROJECT_BURST: ${RATE_LIMIT_INGEST_PROJECT_BURST:-400000}
      RATE_LIMIT_API_KEY_PER_SECOND: ${RATE_LIMIT_API_KEY_PER_SECOND:-3000}
      RATE_LIMIT_API_KEY_BURST: ${RATE_LIMIT_API_KEY_BURST:-6000}
      RATE_LIMIT_API_PROJECT_PER_SECOND: ${RATE_LIMIT_API_PROJECT_PER_SECOND:-10000}
      RATE_LIMIT_API_PROJECT_BURST: ${RATE_LIMIT_API_PROJECT_BURST:-20000}
      RATE_LIMIT_MAX_ENTRIES: ${RATE_LIMIT_MAX_ENTRIES:-100000}
      RATE_LIMIT_MAX_ENTRIES_PER_TENANT: ${RATE_LIMIT_MAX_ENTRIES_PER_TENANT:-10000}
      RATE_LIMIT_IDLE_TTL_MS: ${RATE_LIMIT_IDLE_TTL_MS:-600000}
      RETENTION_WORKER_ENABLED: ${RETENTION_WORKER_ENABLED:-true}
      RETENTION_INTERVAL_MS: ${RETENTION_INTERVAL_MS:-900000}
      RETENTION_CONTINUATION_DELAY_MS: ${RETENTION_CONTINUATION_DELAY_MS:-1000}
      RETENTION_MAX_CONSECUTIVE_CONTINUATIONS: ${RETENTION_MAX_CONSECUTIVE_CONTINUATIONS:-5}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-5000}
      RETENTION_MAX_BATCHES: ${RETENTION_MAX_BATCHES:-100}
      RETENTION_MAX_ROWS_PER_RUN: ${RETENTION_MAX_ROWS_PER_RUN:-100000}
      RETENTION_MAX_RUN_MS: ${RETENTION_MAX_RUN_MS:-5000}
      POOLSTATIS_MCP_PACKAGE_PUBLISHED: ${POOLSTATIS_MCP_PACKAGE_PUBLISHED:-false}
      POOLSTATIS_EXPERIENCE_ARTIFACT_DIR: /var/lib/poolstatis/experience-artifacts
    volumes:
      - poolstatis_artifacts:/var/lib/poolstatis/experience-artifacts
    ports:
      - "${POOLSTATIS_API_PORT:-3300}:3300"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20

  admin:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      poolstatis:
        condition: service_healthy
    ports:
      - "${POOLSTATIS_ADMIN_PORT:-8080}:80"

volumes:
  poolstatis_pgdata:
  poolstatis_artifacts:
