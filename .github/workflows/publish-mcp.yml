name: Publish MCP package

on:
  workflow_dispatch:
  # This one-shot branch trigger publishes 0.4.0 from the reviewed production
  # lineage without merging the divergent default branch. Remove it immediately
  # after registry verification.
  push:
    branches:
      - codex/event-backfill-revisions

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/event-backfill-revisions'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: poolsatis
          POSTGRES_PASSWORD: poolsatis
          POSTGRES_DB: poolsatis
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U poolsatis"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@10.13.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Pack, test, and publish one artifact
        run: |
          mkdir -p .release
          MCP_VERSION=$(node -p "require('./packages/mcp/package.json').version")
          if npm view "@poolstatis/mcp@$MCP_VERSION" version >/dev/null 2>&1; then
            echo "@poolstatis/mcp@$MCP_VERSION already exists; refusing to overwrite"
            exit 1
          fi
          MCP_TARBALL="$PWD/.release/poolstatis-mcp-$MCP_VERSION.tgz"
          npm pack --json --pack-destination .release ./packages/mcp > .release/pack-output.txt
          POOLSTATIS_MCP_TARBALL="$MCP_TARBALL" \
          POOLSTATIS_MCP_PACK_OUTPUT="$PWD/.release/pack-output.txt" \
            pnpm mcp:package:test
          npm publish "$MCP_TARBALL" --access public
