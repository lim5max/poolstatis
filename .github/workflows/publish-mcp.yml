name: Publish MCP package

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: poolsatis
          POSTGRES_PASSWORD: poolsatis
          POSTGRES_DB: poolsatis
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U poolsatis"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify exact main lineage
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@10.13.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Pack and test one artifact
        run: |
          mkdir -p .release
          MCP_VERSION=$(node -p "require('./packages/mcp/package.json').version")
          if npm view "@poolstatis/mcp@$MCP_VERSION" version >/dev/null 2>&1; then
            echo "@poolstatis/mcp@$MCP_VERSION already exists; refusing to overwrite"
            exit 1
          fi
          MCP_TARBALL="$PWD/.release/poolstatis-mcp-$MCP_VERSION.tgz"
          npm pack --json --pack-destination .release ./packages/mcp > .release/pack-output.txt
          POOLSTATIS_MCP_TARBALL="$MCP_TARBALL" \
          POOLSTATIS_MCP_PACK_OUTPUT="$PWD/.release/pack-output.txt" \
            pnpm mcp:package:test
          (
            cd .release
            sha512sum "poolstatis-mcp-$MCP_VERSION.tgz" > mcp.sha512
          )
      - name: Preserve immutable verified MCP artifact
        uses: actions/upload-artifact@v4
        with:
          name: poolstatis-mcp-release
          path: |
            .release/poolstatis-mcp-*.tgz
            .release/mcp.sha512
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: poolstatis-mcp-release
          path: .release
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish exact verified MCP tarball
        run: |
          (
            cd .release
            sha512sum --check mcp.sha512
          )
          mapfile -t MCP_TARBALLS < <(find .release -maxdepth 1 -type f -name 'poolstatis-mcp-*.tgz' -print)
          test "${#MCP_TARBALLS[@]}" -eq 1
          MCP_TARBALL="${MCP_TARBALLS[0]}"
          npm publish "$MCP_TARBALL" --access public --provenance
